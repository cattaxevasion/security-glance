name: Collect & Deploy

on:
  schedule:
    # 30분마다. 새 기사가 없으면 수집기가 바로 끝내고 저장·배포를 건너뛴다.
    # 취약점·벤더 리서치는 수집기가 6시간마다만 (전체 실행). 브리핑은 일본 시간 6시 이후 첫 실행
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "이번 실행에서 요약할 새 기사 최대 개수"
        default: "80"
      briefing:
        description: "오늘의 브리핑을 지금 다시 만들기"
        type: boolean
        default: false
      full:
        description: "전체 실행 (취약점·벤더 리서치까지)"
        type: boolean
        default: false
      en_fill:
        description: "영어가 빈 이전 기사·토픽을 이번 실행에서 몇 건까지 채울지 (비우면 기사 150 · 토픽 100)"
        default: ""
  push:
    branches: [main]

# 권한은 잡마다 필요한 만큼만 (수집 잡은 외부 피드·HTML을 다루고 npm 패키지 스크립트가 돌므로 배포 권한을 주지 않는다)
permissions: {}

concurrency:
  group: collect-and-deploy
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # 평소 2~6분, 이전 데이터를 한꺼번에 채우는 수동 실행도 15분 안팎. API 호출이 멈춰도 다음 실행을 계속 막지 않게
    timeout-minutes: 45
    permissions:
      contents: write
    outputs:
      # 코드가 바뀌었거나(push) 데이터가 바뀌었을 때만 배포
      deploy: ${{ github.event_name == 'push' || steps.collect.outputs.changed == 'true' }}
    steps:
      - uses: actions/checkout@v5
        with:
          # 토큰을 .git/config에 남기지 않는다 (data 브랜치 push는 아래에서 토큰을 직접 넘긴다)
          persist-credentials: false

      # 수집 데이터는 main이 아니라 data 브랜치에 커밋 하나로 둔다 (main 기록과 저장소 크기를 깨끗하게)
      # 브랜치가 '없는' 것과 '못 받은' 것을 구분한다: 못 받았는데 빈 상태로 이어 가면 그 결과가 90일치 데이터를 덮어쓴다
      - name: Restore data from data branch
        run: |
          set +e
          git ls-remote --exit-code --heads origin data > /dev/null
          code=$?
          set -e
          if [ "$code" = 2 ]; then
            echo "data 브랜치가 없어 빈 상태로 시작합니다"
            exit 0
          fi
          if [ "$code" != 0 ]; then
            echo "::error::data 브랜치를 확인하지 못했습니다 (git ls-remote 종료 코드 $code). 데이터를 덮어쓰지 않도록 멈춥니다"
            exit 1
          fi
          for i in 1 2 3; do
            git fetch --depth=1 origin data && break
            [ "$i" = 3 ] && { echo "::error::data 브랜치를 받지 못했습니다. 데이터를 덮어쓰지 않도록 멈춥니다"; exit 1; }
            sleep $((i * 10))
          done
          git archive FETCH_HEAD public/data data | tar -x
          # 덮어쓰기 전 판을 data-prev로 남기는 데 쓴다
          echo "DATA_SHA=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # astro sync가 만드는 .astro/types.d.ts(import.meta.env, CSS import 타입)가 있어야 타입 검사가 된다
      - name: Typecheck
        run: npx astro sync && npx tsc --noEmit -p .

      - name: Test
        run: npm test

      - name: Collect news and vulnerabilities
        id: collect
        run: npm run collect -- ${{ inputs.briefing && '--briefing' || '' }} ${{ inputs.full && '--full' || '' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          MAX_NEW_PER_RUN: ${{ inputs.limit || '80' }}
          EN_FILL_ARTICLES: ${{ inputs.en_fill }}
          EN_FILL_TOPICS: ${{ inputs.en_fill }}

      # 화면이 받는 파일에 언어 섞임이 하나라도 있으면 저장·배포를 멈춘다 (수집기가 고치고 확인했으므로 늘 0이어야 함).
      # 저장보다 먼저: 섞인 데이터가 data 브랜치에 남아 다음 실행까지 이어지지 않게
      - name: Check no language mixing in UI and data
        if: github.event_name == 'push' || steps.collect.outputs.changed == 'true'
        run: npm run check:i18n -- --data

      - name: Save data to data branch (single commit, force push)
        if: steps.collect.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          store="$RUNNER_TEMP/store"
          rm -rf "$store" && mkdir -p "$store/public/data" "$store/data"
          cp public/data/*.json "$store/public/data/"
          cp data/*.json "$store/data/"
          printf '# data branch\n\nSecurity Glance 수집 데이터. GitHub Actions가 실행마다 커밋 하나로 덮어쓴다(force push). 직접 수정하지 말 것.\n' > "$store/README.md"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # 덮어쓰기 전 판을 data-prev에 남긴다 (잘못된 실행이 덮어써도 한 단계 되돌릴 수 있게)
          if [ -n "${DATA_SHA:-}" ]; then
            git push -q -f "$remote" "${DATA_SHA}:refs/heads/data-prev" || echo "::warning::data-prev 백업 push 실패"
          fi
          cd "$store"
          git init -q -b data
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
          # GitHub 쪽 일시 오류(종료 코드 128 등)면 잠시 뒤 다시 (세 번까지)
          for i in 1 2 3; do
            git push -q -f "$remote" data && break
            [ "$i" = 3 ] && exit 1
            echo "push 실패, $((i * 10))초 뒤 다시"; sleep $((i * 10))
          done

      # news.json(요약 전문)·topics.json(토픽 전체)·vulns.json(취약점 전체)은 수집기 내부용.
      # 화면은 가벼운 articles.json과 나눠 둔 topics-{recent,archive}-{core,ko,ja,en}.json, vulns-core.json·cves.json만 쓴다.
      - name: Keep only what the site needs
        if: github.event_name == 'push' || steps.collect.outputs.changed == 'true'
        run: rm -f public/data/news.json public/data/topics.json public/data/vulns.json

      # 토픽 링크 미리보기 이미지: 지난 실행에서 그린 것은 캐시에서 꺼내 쓰고 바뀐 토픽만 새로 그린다
      - name: Restore link preview images
        if: github.event_name == 'push' || steps.collect.outputs.changed == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .og-cache
          key: og-v1-${{ github.run_id }}
          restore-keys: og-v1-

      - name: Draw link preview images
        id: og
        if: github.event_name == 'push' || steps.collect.outputs.changed == 'true'
        run: npm run og

      - name: Save link preview images
        if: steps.og.outputs.drawn > 0
        uses: actions/cache/save@v4
        with:
          path: .og-cache
          key: og-v1-${{ github.run_id }}

      - name: Build site
        if: github.event_name == 'push' || steps.collect.outputs.changed == 'true'
        run: npm run build
        env:
          SITE: https://${{ github.repository_owner }}.github.io
          BASE_PATH: /${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name == 'push' || steps.collect.outputs.changed == 'true'
        with:
          path: dist

  deploy:
    needs: collect
    if: needs.collect.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
